<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAMI-EXTENSION</title>
    <style>
      :root {
        --bg-1: #f8fafc;
        --bg-2: #eefbf6;
        --bg-3: #f5f3ff;
        --card: rgba(255,255,255,0.82);
        --text: #0f172a;
        --muted: #475569;
        --accent: #10b981;
        --accent-soft: #d1fae5;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 520px);
        text-align: center;
        background: var(--card);
        border: 1px solid rgba(148,163,184,0.35);
        border-radius: 28px;
        padding: 32px 24px;
        box-shadow: 0 25px 80px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(8px);
      }

      .badge {
        display: inline-block;
        margin-bottom: 18px;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #065f46;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 2.9rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: var(--muted);
        font-size: 1rem;
      }

      .button {
        display: inline-block;
        margin-top: 22px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">KAMI-EXTENSION</div>
      <h1>Connectez-vous pour voir le contenu</h1>
      <p>Vous êtes actuellement hors ligne. Revenez en ligne puis rechargez la page pour accéder à votre espace.</p>
      <a class="button" href="/">Réessayer</a>
    </main>
  </body>
</html>
