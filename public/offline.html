<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion requise - KAMI-EXTENSION</title>
    <style>
        :root {
            --brand-blue: #2563eb;
            --brand-yellow: #facc15;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icon {
            width: 40px;
            height: 40px;
            color: var(--brand-blue);
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 12px;
            color: #0f172a;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            background: var(--brand-blue);
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
            background: #1d4ed8;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-circle">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
            </svg>
        </div>
        <h1>Connexion requise</h1>
        <p>Pour accéder à KAMI-EXTENSION, veuillez vous connecter à Internet. Vérifiez votre Wi-Fi ou vos données mobiles.</p>
        <a href="javascript:window.location.reload()" class="btn">Réessayer</a>
        <div class="footer">KAMI-EXTENSION V3</div>
    </div>
</body>
</html>
